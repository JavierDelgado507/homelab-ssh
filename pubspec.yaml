name: homelab_ssh
description: Cliente SSH personal para homelab
version: 6.16.0+72
publish_to: 'none'

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  dartssh2: ^2.9.0
  xterm:
    path: packages/xterm
  flutter_secure_storage: ^9.2.2
  file_picker: ^8.1.2
  path_provider: ^2.1.4
  uuid: ^4.5.1
  flutter_pty: ^0.3.1
  flutter_foreground_task: ^8.11.0
  flutter_file_dialog: ^3.0.2
  local_auth: ^2.2.0
  quick_actions: ^1.0.7
  cryptography: ^2.7.0
  url_launcher: ^6.3.0
  simple_icons: ^10.1.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/fonts/

  fonts:
    - family: JetBrainsMono
      fonts:
        - asset: assets/fonts/JetBrainsMono-Regular.ttf
        - asset: assets/fonts/JetBrainsMono-Bold.ttf
          weight: 700
